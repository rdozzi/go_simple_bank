version: '2'
# plugins:
#   - name:
sql:
  - schema: './db/migration'
    engine: 'postgresql'
    queries: './db/query'
    gen:
      go:
        package: 'db'
        out: './db/sqlc'
        sql_package: 'pgx/v5'
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        overrides:
          - db_type: 'timestamptz'
            go_type: 'time.Time'
          - db_type: 'uuid'
            go_type: 'github.com/google/uuid.UUID'
