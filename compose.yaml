version: '5.5.0'
services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=root
      - POSTGRES_DB=simple_bank
    ports:
      - '5432:5432'
    volumes:
      - myapp:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d simple_bank']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
      - '9090:9090'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_SOURCE=postgresql://root:secret@postgres:5432/simple_bank?sslmode=disable
      - REDIS_ADDRESS=redis:6379
volumes:
  myapp:
