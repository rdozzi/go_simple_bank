apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-bank-api-deployment
  labels:
    app: simple-bank-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-bank-api
  template:
    metadata:
      labels:
        app: simple-bank-api
    spec:
      containers:
        - name: simple-bank-api
          image: 113983761635.dkr.ecr.us-east-1.amazonaws.com/simplebank:dbcf624a786c88863c0c79a84e57c32c704ac361
          ports:
            - containerPort: 8080
