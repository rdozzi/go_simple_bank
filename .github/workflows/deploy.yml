name: Deploy to production

on:
  push:
    branches: ['main']

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.37.0' # default is latest stable
        id: install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load Production Secrets
        run: aws secretsmanager get-secret-value --secret-id simple_bank --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.prod.env

      # Course deployment currently expects app.env inside the Docker image.
      # Production applications should inject secrets at runtime instead.
      - name: Prepare production config
        run: cp app.prod.env app.env

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: simplebank
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Kubernetes Deployment Steps
      # Connect kubectl to the EKS cluster
      - name: Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig \
          --region us-east-1 \
          --name simple-bank

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -f eks/deployment.yaml
          kubectl apply -f eks/service.yaml
          kubectl apply -f eks/ingress.yaml

      - name: Update Kubernetes deployment image
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: simplebank
          IMAGE_TAG: ${{github.sha}}
        run: |
          kubectl set image \
            deployment/simple-bank-api-deployment \
            simple-bank-api=$REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/simple-bank-api-deployment \
          --timeout=120s
